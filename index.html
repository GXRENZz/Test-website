<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysiaxz | Bio Link</title>
    <!-- Font Awesome สำหรับไอคอนโซเชียล -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            /* เอฟเฟกต์ดาว/จุดระยิบระยับบนพื้นหลัง */
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
                radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* รูปโปรไฟล์ */
        .avatar-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin-bottom: 15px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            /* เปลี่ยน URL เป็นรูปภาพของคุณ */
            background-image: url('https://via.placeholder.com/150'); 
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* ชื่อและคำอธิบาย */
        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
            font-family: 'Georgia', serif;
            letter-spacing: 0.5px;
        }

        p.bio {
            color: #888888;
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-weight: 500;
        }

        /* เครื่องเล่นเพลง Spotify Embed Card */
        .spotify-card {
            width: 100%;
            background-color: #121212;
            border-radius: 16px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .album-cover {
            width: 50px;
            height: 50px;
            border-radius: 6px;
            background-color: #333;
            object-fit: cover;
        }

        .track-details {
            text-align: left;
        }

        .track-title {
            font-weight: bold;
            font-size: 0.95rem;
            color: #fff;
        }

        .artist-name {
            font-size: 0.8rem;
            color: #b3b3b3;
            margin-bottom: 4px;
        }

        .badge-preview {
            display: inline-block;
            font-size: 0.65rem;
            background-color: #282828;
            color: #b3b3b3;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #b3b3b3;
        }

        .play-btn {
            width: 32px;
            height: 32px;
            background-color: #fff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* ปุ่มลิงก์โซเชียล */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-item {
            width: 100%;
            background-color: #111113;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .link-item:hover {
            background-color: #1a1a1e;
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .icon-box {
            width: 36px;
            height: 36px;
            background-color: #1c1c1f;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 1.1rem;
        }

        /* Footer */
        footer {
            margin-top: 40px;
            font-size: 0.75rem;
            color: #555555;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profile Image -->
        <div class="avatar-container">
            <!-- ใส่ URL รูปภาพของคุณแทนที่ src -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Elysiaxz" class="avatar">
        </div>

        <!-- Name & Bio -->
        <h1>Elysiaxz</h1>
        <p class="bio">seen this Angel?</p>

        <!-- Spotify Card -->
        <div class="spotify-card">
            <div class="music-info">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=100&q=80" class="album-cover" alt="Album Cover">
                <div class="track-details">
                    <div class="track-title">leave</div>
                    <div class="artist-name">Kuja</div>
                    <span class="badge-preview">Preview</span>
                </div>
            </div>
            <div class="music-controls">
                <i class="fa-regular fa-circle-plus" style="cursor: pointer;"></i>
                <i class="fa-solid fa-ellipsis" style="cursor: pointer;"></i>
                <i class="fa-solid fa-spotify" style="color: #1ed760; font-size: 1.2rem; margin-right: 4px;"></i>
                <div class="play-btn">
                    <i class="fa-solid fa-play" style="margin-left: 2px;"></i>
                </div>
            </div>
        </div>

        <!-- Social Links -->
        <div class="links-container">
            <a href="#" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-discord"></i></div>
                <span>Discord</span>
            </a>

            <a href="#" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-x-twitter"></i></div>
                <span>X (Twitter)</span>
            </a>

            <a href="#" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-instagram"></i></div>
                <span>Instagram</span>
            </a>

            <a href="#" class="link-item">
                <div class="icon-box"><i class="fa-brands fa-spotify"></i></div>
                <span>Spotify</span>
            </a>
        </div>

        <!-- Footer -->
        <footer>
            &copy; 2026 Elysiaxz
        </footer>
    </div>

</body>
</html>
